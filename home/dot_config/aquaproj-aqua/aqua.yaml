# aqua global config — managed by chezmoi
# Add or comment-out packages to control what gets installed.
# Run `aqua install` (or `chezmoi apply`) to apply changes.
# https://aquaproj.github.io/docs/reference/config/
#
# CI validates this file on every push/PR (job "aqua-validate" in
# .github/workflows/ci.yml) by running `aqua install -a`, which fails fast if
# a pinned version/asset doesn't actually exist (e.g. a bad version tag).

registries:
  - type: standard
    ref: v4.560.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: registry.yaml

packages:
  # ── Shell / Terminal ────────────────────────────────────────────────────────
