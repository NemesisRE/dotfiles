    tags:
      - default
      - required
  - name: zellij-org/zellij@v0.45.1 # renovate: depName=zellij-org/zellij
    tags:
      - default
      - required
  - name: sxyazi/yazi@v26.9.1 # renovate: depName=sxyazi/yazi
    tags:
      - default
