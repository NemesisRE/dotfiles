# Claude Code user-scope settings, merged into ~/.claude/settings.json by
# private_dot_claude/modify_private_settings.json.tmpl.
#
# Every top-level key under `settings` is OWNED by chezmoi: it is replaced
# wholesale on apply, so a nested key you add by hand under a managed key is
# overwritten. Keys not listed here (permissions, hooks, env, ...) are left alone,
# which matters because Claude Code also writes this file itself.
#
# Reference: https://code.claude.com/docs/en/settings-reference
claude:
  settings:
    # Do not add a Co-Authored-By trailer to commits or attribution text to PR
    # descriptions. Empty strings hide them; `includeCoAuthoredBy` is deprecated
    # and ignored once `attribution` is set. `sessionUrl: false` also drops the
    # Claude-Session trailer added from cloud / Remote Control sessions.
    attribution:
      commit: ""
      pr: ""
      sessionUrl: false
