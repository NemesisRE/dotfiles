# Kitty version data for chezmoi
#
# `sha256` pins the release archives installed by
# run_onchange_after_linux_kitty.sh.tmpl; a download that does not match is
# rejected. Renovate bumps `version`; .github/workflows/refresh-pins.yml then
# recomputes the hashes on the PR branch and re-runs CI. By hand: change `version`
# and run `.github/scripts/pins.py update` (the `pins` CI job fails until they match).
kitty:
  version: "v0.49.0" # renovate: depName=kovidgoyal/kitty
  quake_key: "F12"
  sha256:
    x86_64: "967a1958e7fc67b495d279c0963bcd1a0482097151817ce6506fabc822689af7"
    arm64: "534b214d407a05e4603da75ef02fffa592ec1bbec20a413c5e0cd3f853c928cb"
