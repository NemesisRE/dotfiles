# OS prerequisite packages managed by chezmoi
# Separated from user CLI tools managed by aqua (aqua.yaml).
# Re-applied automatically whenever this file changes.

packages:
  darwin:
    brews:
      - bash
      - bash-completion@2
      - git
      - curl
      - diffutils
      - util-linux
    casks:
      - kitty
      - font-fira-mono-nerd-font
  windows:
    winget:
      - Microsoft.PowerShell
      - Microsoft.WindowsTerminal
      - Git.Git
      - DEVCOM.FiraCodeFont
      - LLVM.LLVM
      - albertony.npiperelay
  linux:
    apt:
      - git
      - curl
      - zsh
      - fonts-firacode
      - build-essential
      - socat
    pacman:
      - git
      - curl
      - zsh
      - ttf-firacode-nerd
      - base-devel
      - socat
    dnf:
      - git
      - curl
      - zsh
      - fira-code-fonts
      - gcc
      - gcc-c++
      - make
      - socat
