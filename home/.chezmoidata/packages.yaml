# OS prerequisite packages managed by chezmoi
# Separated from user CLI tools managed by aqua (aqua.yaml).
# Re-applied automatically whenever this file changes.
#
# Font family: the whole repo standardizes on FiraCode Nerd Font Mono (kitty,
# Konsole, Windows Terminal). On Linux it comes from the pinned, checksummed
# ryanoasis/nerd-fonts release archive (.chezmoiexternals/fonts.toml.tmpl), not
# a distro package — apt/dnf only carry plain Fira Code (no Nerd glyphs), and
# pacman's ttf-firacode-nerd would be a second, distro-versioned copy of the
# same font. On macOS it comes from the font-fira-code-nerd-font cask below.
# Windows has no winget package for it (DEVCOM.FiraCodeFont, previously listed
# here, no longer exists in the winget-pkgs manifest tree as of 2026-09); until
# one exists, Windows users install the font by hand — see docs/windows.md.

packages:
  darwin:
    brews:
      - bash
      - bash-completion@2
      - git
      - curl
      - diffutils
      - util-linux
      - btop # aqua's btop is Linux-only
      - coreutils # gtimeout, used by the fish/nu prompt timeout wizard
      - sshpass
    casks:
      - kitty
      - font-fira-code-nerd-font
  windows:
    winget:
      - Microsoft.PowerShell
      - Microsoft.WindowsTerminal
      - Git.Git
      - LLVM.LLVM
      - albertony.npiperelay
  linux:
    apt:
      - git
      - curl
      - zsh
      - build-essential
      - socat
      - xz-utils
      - unzip
      - fontconfig
      - file
      - ca-certificates
      - sshpass
    pacman:
      - git
      - curl
      - zsh
      - base-devel
      - socat
      - xz
      - unzip
      - fontconfig
      - file
      - ca-certificates
      - sshpass
    dnf:
      - git
      - curl
      - zsh
      - gcc
      - gcc-c++
      - make
      - socat
      - xz
      - unzip
      - fontconfig
      - file
      - ca-certificates
      - sshpass
