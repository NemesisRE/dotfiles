# Pinned aqua release used by the Windows *fallback* installer (when winget is
# unavailable) in run_once_before_windows_install-tools.ps1.tmpl. Downloaded zips
# are verified against these SHA-256 values and rejected on mismatch.
#
# bootstrap.ps1 is fetched raw before chezmoi exists, so it cannot read this file
# and carries the same literals; `.github/scripts/pins.py verify` (run in CI) checks
# they agree with each other and with the real release assets.
#
# Renovate bumps `version`; .github/workflows/refresh-pins.yml then recomputes the
# hashes (and bootstrap.ps1's copy) on the PR branch and re-runs CI. By hand: change
# `version` and run `.github/scripts/pins.py update`.
aquaBootstrap:
  version: "v2.65.2" # renovate: depName=aquaproj/aqua
  windows:
    amd64: "d22e7710ccfd45ba7dccf582240e0a0089ed0a47092b7d3037acb3829ba2027f"
    arm64: "8b28f711d4080cd806077e63a6bcfc00b549de2cc8c5f33fbf0670e90107bca0"
