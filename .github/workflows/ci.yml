name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - home/dot_config/yazi/package.toml.tmpl
  # Lets refresh-pins.yml re-run CI on a commit it pushed with the default token
  # (which does not trigger `pull_request` runs), so those PRs are still checked.
  workflow_dispatch:

jobs:
  # ── ShellCheck ───────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck — shell function library
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: home/dot_local/share/nredf/shell
          severity: warning

      - name: ShellCheck — bootstrap script
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          additional_files: bootstrap.sh
          severity: warning

  # ── YAML lint ────────────────────────────────────────────────────────────────
  yamllint:
    name: YAML lint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

  # ── chezmoi template dry-run ─────────────────────────────────────────────────
  chezmoi-dry-run:
    name: chezmoi apply --dry-run (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${HOME}/.local/bin"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$HOME/.local/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Invoke-WebRequest -Uri "https://get.chezmoi.io/ps1" -OutFile "$env:TEMP/get-chezmoi.ps1"
          & "$env:TEMP/get-chezmoi.ps1" -b $binDir
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # `chezmoi init` is the ONLY command that evaluates .chezmoi.toml.tmpl.
      # Without this step those 236 lines of template logic never run in CI.
      - name: Generate config — verifies .chezmoi.toml.tmpl renders (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi init --source="${GITHUB_WORKSPACE}" \
            --config-path "${RUNNER_TEMP}/chezmoi.toml" \
            --promptDefaults --no-tty < /dev/null
          echo "--- generated config ---"
          cat "${RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — default data (Unix)
        if: runner.os != 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi apply --dry-run --force --source="${GITHUB_WORKSPACE}" \
            --config "${RUNNER_TEMP}/chezmoi.toml" 2>&1

      # Every optional toggle defaults to false in .chezmoidata/, so the branches
      # behind them are otherwise never rendered on any OS.
      - name: Dry-run — all optional paths enabled (Unix)
        if: runner.os != 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi apply --dry-run --force --source="${GITHUB_WORKSPACE}" \
            --config "${RUNNER_TEMP}/chezmoi.toml" \
            --override-data-file "${GITHUB_WORKSPACE}/.github/fixtures/ci-data-full.yaml" 2>&1

      - name: Generate config — verifies .chezmoi.toml.tmpl renders (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chezmoi init --source="${env:GITHUB_WORKSPACE}" `
            --config-path "${env:RUNNER_TEMP}/chezmoi.toml" `
            --promptDefaults --no-tty
          Get-Content "${env:RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — default data (Windows)
        if: runner.os == 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        shell: pwsh
        run: |
          chezmoi apply --dry-run --force --source="${env:GITHUB_WORKSPACE}" `
            --config "${env:RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — all optional paths enabled (Windows)
        if: runner.os == 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        shell: pwsh
        run: |
          chezmoi apply --dry-run --force --source="${env:GITHUB_WORKSPACE}" `
            --config "${env:RUNNER_TEMP}/chezmoi.toml" `
            --override-data-file "${env:GITHUB_WORKSPACE}/.github/fixtures/ci-data-full.yaml"

      # --dry-run renders scripts but never parses them, so a PowerShell syntax
      # error in a .chezmoiscripts/*.ps1.tmpl ships undetected. Parse them here.
      - name: Parse-check rendered PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "${env:GITHUB_WORKSPACE}/home/.chezmoiscripts" -Filter '*.ps1.tmpl' | ForEach-Object {
            $out = Join-Path $env:RUNNER_TEMP ($_.BaseName + '.ps1')
            chezmoi execute-template --source="${env:GITHUB_WORKSPACE}" `
              --config "${env:RUNNER_TEMP}/chezmoi.toml" -f $_.FullName > $out
            if ((Get-Item $out).Length -eq 0) { return }
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($out, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::PowerShell parse error"
              $errs | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  # ── aqua config validation ───────────────────────────────────────────────────
  aqua-validate:
    name: aqua install (validate pinned versions)
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      - name: Install every pinned package (all tags) — fails if a version/asset doesn't exist
        working-directory: home/dot_config/aquaproj-aqua
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_POLICY_CONFIG: ${{ github.workspace }}/home/dot_config/aquaproj-aqua/aqua-policy.yaml
          AQUA_DISABLE_GITHUB_ARTIFACT_ATTESTATION: "true"
        run: aqua install -a

  # ── Rendered-template lint ───────────────────────────────────────────────────
  # The plain `shellcheck` job above cannot see *.tmpl files (the `{{ }}` delimiters
  # are not valid shell) and cannot parse zsh at all, so the rc files, the function
  # bundles and all of .chezmoiscripts/ were previously unchecked. This job renders
  # them first, then lints the output.
  render-lint:
    name: Lint rendered templates
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install chezmoi, shellcheck and zsh
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${HOME}/.local/bin"
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh

      - name: Generate config
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi init --source="${GITHUB_WORKSPACE}" \
            --config-path "${RUNNER_TEMP}/chezmoi.toml" \
            --promptDefaults --no-tty < /dev/null

      - name: Render and lint
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./.github/scripts/lint-rendered.sh "${RUNNER_TEMP}/chezmoi.toml"

      # With `CI` set the secret templates skip the vault entirely, so nothing above
      # reaches their bitwarden code paths. This drives them with a stub `bw`.
      - name: Secret template regression tests
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./.github/scripts/test-secret-templates.py

  # ── PowerShell lint ──────────────────────────────────────────────────────────
  psscriptanalyzer:
    name: PSScriptAnalyzer
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop

      - name: Analyze
        shell: pwsh
        run: ./.github/scripts/analyze-powershell.ps1

  # ── Pinned checksums ─────────────────────────────────────────────────────────
  # Installers here download an archive/script and run it, so each is pinned to a
  # version AND a SHA-256. A pin only helps if it cannot silently rot: this re-downloads
  # every pinned artifact and compares. A Renovate version bump therefore fails here
  # until `.github/scripts/pins.py update` refreshes the hashes.
  pins:
    name: Verify pinned checksums
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify
        run: python3 .github/scripts/pins.py verify

  # ── Markdown lint ────────────────────────────────────────────────────────────
  # AGENTS.md makes markdownlint compliance a hard requirement; enforce it.
  markdownlint:
    name: Markdown lint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.3 --config .markdownlint.yaml "**/*.md"

      # Relative links must resolve, and absolute file:///Users/... links (dead for
      # everyone but their author) are rejected.
      - name: Check Markdown links
        run: python3 .github/scripts/check-md-links.py
