name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - home/dot_config/yazi/package.toml.tmpl
  # Lets refresh-pins.yml re-run CI on a commit it pushed with the default token
  # (which does not trigger `pull_request` runs), so those PRs are still checked.
  workflow_dispatch:
  # Keeps the heavy pins/aqua-install jobs (gated below on `paths-filter` so they
  # don't run on every unrelated push) honest even when nothing in the repo
  # changed — upstream pinned artifacts and aqua registry entries can go stale
  # or disappear on their own.
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

# A new push/PR update supersedes whatever this workflow was already running for
# the same ref — cancel it instead of burning runner time on stale output. Never
# cancel a `push` run on a shared branch (main/master) that's just building once.
# The weekly `schedule` run gets its OWN group (not keyed on `github.ref`, which
# is just the default branch for a schedule event): sharing main's push group
# would let a slow scheduled run (it's the one that actually exercises
# aqua-validate/pins) queue a real push's CI behind it, since neither push nor
# schedule cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Detect changed paths (gates the heavy jobs below) ───────────────────────
  changes:
    name: Detect changed paths
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pins: ${{ steps.filter.outputs.pins }}
      aqua: ${{ steps.filter.outputs.aqua }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No-op on `schedule` (no sensible base commit to diff against there,
      # and none is needed: the downstream jobs' own `if:` already runs them
      # unconditionally on `schedule`, path-filter output or not).
      #
      # `base: ${{ github.ref }}` matches dorny/paths-filter's own documented
      # pattern for "push to a long-lived branch" (this repo pushes straight
      # to main/master, not through a feature-branch merge-base): explicit
      # rather than relying on its "repository default branch" fallback,
      # which would compare a push to `master` against `main`'s tip instead
      # of `master`'s own previous commit. No `fetch-depth` override on the
      # checkout above — the action deepens its own shallow clone as needed
      # (`initial-fetch-depth`, doubling until it finds the merge-base); the
      # same doc page's own example for this exact scenario uses a plain,
      # unmodified `actions/checkout` too.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            pins:
              - '.github/scripts/pins.py'
              - 'home/.chezmoidata/kitty.yaml'
              - 'home/.chezmoidata/aqua-bootstrap.yaml'
              - 'bootstrap.ps1'
            aqua:
              - 'home/dot_config/aquaproj-aqua/**'

  # ── ShellCheck ───────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ShellCheck — shell function library
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: home/dot_local/share/nredf/shell
          severity: warning

      - name: ShellCheck — bootstrap script
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          additional_files: bootstrap.sh
          severity: warning

  # ── YAML lint ────────────────────────────────────────────────────────────────
  yamllint:
    name: YAML lint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

  # ── chezmoi template dry-run ─────────────────────────────────────────────────
  chezmoi-dry-run:
    name: chezmoi apply --dry-run (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${HOME}/.local/bin"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$HOME/.local/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Invoke-WebRequest -Uri "https://get.chezmoi.io/ps1" -OutFile "$env:TEMP/get-chezmoi.ps1"
          & "$env:TEMP/get-chezmoi.ps1" -b $binDir
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # `chezmoi init` is the ONLY command that evaluates .chezmoi.toml.tmpl.
      # Without this step those 236 lines of template logic never run in CI.
      - name: Generate config — verifies .chezmoi.toml.tmpl renders (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi init --source="${GITHUB_WORKSPACE}" \
            --config-path "${RUNNER_TEMP}/chezmoi.toml" \
            --promptDefaults --no-tty < /dev/null
          echo "--- generated config ---"
          cat "${RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — default data (Unix)
        if: runner.os != 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi apply --dry-run --force --source="${GITHUB_WORKSPACE}" \
            --config "${RUNNER_TEMP}/chezmoi.toml" 2>&1

      # Every optional toggle defaults to false in .chezmoidata/, so the branches
      # behind them are otherwise never rendered on any OS.
      - name: Dry-run — all optional paths enabled (Unix)
        if: runner.os != 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi apply --dry-run --force --source="${GITHUB_WORKSPACE}" \
            --config "${RUNNER_TEMP}/chezmoi.toml" \
            --override-data-file "${GITHUB_WORKSPACE}/.github/fixtures/ci-data-full.yaml" 2>&1

      - name: Generate config — verifies .chezmoi.toml.tmpl renders (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chezmoi init --source="${env:GITHUB_WORKSPACE}" `
            --config-path "${env:RUNNER_TEMP}/chezmoi.toml" `
            --promptDefaults --no-tty
          Get-Content "${env:RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — default data (Windows)
        if: runner.os == 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        shell: pwsh
        run: |
          chezmoi apply --dry-run --force --source="${env:GITHUB_WORKSPACE}" `
            --config "${env:RUNNER_TEMP}/chezmoi.toml"

      - name: Dry-run — all optional paths enabled (Windows)
        if: runner.os == 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        shell: pwsh
        run: |
          chezmoi apply --dry-run --force --source="${env:GITHUB_WORKSPACE}" `
            --config "${env:RUNNER_TEMP}/chezmoi.toml" `
            --override-data-file "${env:GITHUB_WORKSPACE}/.github/fixtures/ci-data-full.yaml"

      # --dry-run renders scripts but never parses them, so a PowerShell syntax
      # error in a .chezmoiscripts/*.ps1.tmpl ships undetected. Parse them here.
      - name: Parse-check rendered PowerShell scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "${env:GITHUB_WORKSPACE}/home/.chezmoiscripts" -Filter '*.ps1.tmpl' | ForEach-Object {
            $out = Join-Path $env:RUNNER_TEMP ($_.BaseName + '.ps1')
            chezmoi execute-template --source="${env:GITHUB_WORKSPACE}" `
              --config "${env:RUNNER_TEMP}/chezmoi.toml" -f $_.FullName > $out
            if ((Get-Item $out).Length -eq 0) { return }
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($out, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::PowerShell parse error"
              $errs | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  # ── aqua config validation ───────────────────────────────────────────────────
  # `aqua install -a` resolves and downloads every pinned package's asset for
  # every configured tag — slow, and only actually exercises anything new when
  # aqua.yaml (or its lockfile/policy) changed, so it's gated the same way as
  # the pins job below: on a relevant path change, on the weekly schedule so an
  # upstream registry/asset regression is still caught even with no diff, or on
  # a manual `workflow_dispatch` (a deliberate "check everything now" request
  # — gating that on a diff too would make a manual re-run silently skip it).
  aqua-validate:
    name: aqua install (validate pinned versions)
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.actor != 'github-actions[bot]') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.aqua == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      - name: Install every pinned package (all tags) — fails if a version/asset doesn't exist
        working-directory: home/dot_config/aquaproj-aqua
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_POLICY_CONFIG: ${{ github.workspace }}/home/dot_config/aquaproj-aqua/aqua-policy.yaml
          AQUA_DISABLE_GITHUB_ARTIFACT_ATTESTATION: "true"
        run: aqua install -a

  # ── Rendered-template lint ───────────────────────────────────────────────────
  # The plain `shellcheck` job above cannot see *.tmpl files (the `{{ }}` delimiters
  # are not valid shell) and cannot parse zsh at all, so the rc files, the function
  # bundles and all of .chezmoiscripts/ were previously unchecked. This job renders
  # them first, then lints the output.
  render-lint:
    name: Lint rendered templates
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # fish still comes from apt, not aqua: fish-shell/fish-shell in aqua.yaml
      # doesn't carry the `ci-lint` tag that nu's entry does (only nu needs
      # that filter, to install just one package without pulling in the rest
      # of aqua.yaml) — install it via aqua too if that tag gets added.
      - name: Install chezmoi, shellcheck, zsh and fish
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${HOME}/.local/bin"
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck zsh fish

      # Installed via the same pinned aqua-installer/version as the
      # aqua-validate job, so this is provably the same nu build that job
      # already validates against aqua.yaml's pin — not a second,
      # independently-versioned install path.
      - name: Install aqua and nu
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      - name: Install nu (via aqua)
        working-directory: home/dot_config/aquaproj-aqua
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_POLICY_CONFIG: ${{ github.workspace }}/home/dot_config/aquaproj-aqua/aqua-policy.yaml
          AQUA_DISABLE_GITHUB_ARTIFACT_ATTESTATION: "true"
        # aqua has no package-name filter, only tag-based filtering — see
        # the `ci-lint` tag's comment in aqua.yaml.
        run: aqua install -t ci-lint

      - name: Persist aqua config for later steps
        # `nu` (installed above) is an aqua-proxy symlink, not a plain
        # binary: invoking it from a directory that isn't aqua.yaml's own
        # (or a parent of it) leaves the proxy unable to find its config, so
        # it fails with "command is not found" — reproduced locally by
        # running `nu` without AQUA_CONFIG set from outside this directory.
        # The later "Render and lint" step runs from the repo root, so this
        # has to be exported once, persistently, via $GITHUB_ENV.
        run: |
          echo "AQUA_CONFIG=${GITHUB_WORKSPACE}/home/dot_config/aquaproj-aqua/aqua.yaml" >>"${GITHUB_ENV}"
          echo "AQUA_POLICY_CONFIG=${GITHUB_WORKSPACE}/home/dot_config/aquaproj-aqua/aqua-policy.yaml" >>"${GITHUB_ENV}"

      - name: Generate config
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi init --source="${GITHUB_WORKSPACE}" \
            --config-path "${RUNNER_TEMP}/chezmoi.toml" \
            --promptDefaults --no-tty < /dev/null

      - name: Render and lint
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./.github/scripts/lint-rendered.sh "${RUNNER_TEMP}/chezmoi.toml"

      # With `CI` set the secret templates skip the vault entirely, so nothing above
      # reaches their bitwarden code paths. This drives them with a stub `bw`.
      - name: Secret template regression tests
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          ./.github/scripts/test-secret-templates.py

  # ── Repo-wide invariants ─────────────────────────────────────────────────────
  # Static, source-only checks from AGENTS.md that no render/lint step above
  # catches: a run_onchange_ script whose hash comment can't detect its own
  # input changing, a hook missing its CI/NREDF_NO_BOOTSTRAP guard, a modify_
  # script with the wrong shape, a secret-fed file that isn't private_.
  repo-rules:
    name: Repository rules
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: test-repo-rules.py
        run: ./.github/scripts/test-repo-rules.py

  # ── PowerShell lint ──────────────────────────────────────────────────────────
  psscriptanalyzer:
    name: PSScriptAnalyzer
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        env:
          # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
          PSSCRIPTANALYZER_VERSION: 1.25.0
        run: Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -Scope CurrentUser -ErrorAction Stop

      - name: Analyze
        shell: pwsh
        run: ./.github/scripts/analyze-powershell.ps1

  # ── Pinned checksums ─────────────────────────────────────────────────────────
  # Installers here download an archive/script and run it, so each is pinned to a
  # version AND a SHA-256. A pin only helps if it cannot silently rot: this re-downloads
  # every pinned artifact and compares. A Renovate version bump therefore fails here
  # until `.github/scripts/pins.py update` refreshes the hashes.
  # Gated the same way as aqua-validate above: re-downloading and re-hashing
  # every pinned artifact is slow and network-bound, so it only needs to run
  # when a pin-relevant path changed, weekly to catch an upstream artifact
  # rotting (same SHA-256 no longer being served) even without a local diff, or
  # on `workflow_dispatch` — including the `refresh-pins.yml`-triggered one
  # this file's `on:` block documents, which always does have a pin-relevant
  # diff, but a manual dispatch for any other reason should still run this.
  pins:
    name: Verify pinned checksums
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.actor != 'github-actions[bot]') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.pins == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify
        run: python3 .github/scripts/pins.py verify

  # ── Markdown lint ────────────────────────────────────────────────────────────
  # AGENTS.md makes markdownlint compliance a hard requirement; enforce it.
  markdownlint:
    name: Markdown lint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # check.sh's markdownlint_all() pins the same version when it has to
      # fall back to `npx`/`bunx` (i.e. markdownlint-cli2 isn't already on
      # PATH) — keep the two in sync.
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.3 --config .markdownlint.yaml "**/*.md"

      # Relative links must resolve, and absolute file:///Users/... links (dead for
      # everyone but their author) are rejected.
      - name: Check Markdown links
        run: python3 .github/scripts/check-md-links.py

  # ── GitHub Actions workflow lint ─────────────────────────────────────────────
  # check.sh already runs actionlint locally when it's installed; CI had no
  # equivalent gate at all until now. raven-actions/actionlint is a plain
  # install-and-run wrapper (no reviewdog dependency, so no extra checks:write
  # / pull-requests:write permission is needed beyond this workflow's
  # top-level contents:read) — pin its own `version` input too, not just the
  # wrapper action's SHA, so a wrapper update can't silently change which
  # actionlint build runs.
  actionlint:
    name: actionlint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          fail-on-error: true
