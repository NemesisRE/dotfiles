name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - home/dot_config/yazi/package.toml.tmpl

jobs:
  # ── ShellCheck ───────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck — shell function library
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: home/dot_local/share/nredf/shell
          severity: warning

      - name: ShellCheck — bootstrap script
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: bootstrap.sh
          severity: warning

  # ── YAML lint ────────────────────────────────────────────────────────────────
  yamllint:
    name: YAML lint
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: home/.chezmoidata/
          config_file: .yamllint.yml

  # ── chezmoi template dry-run ─────────────────────────────────────────────────
  chezmoi-dry-run:
    name: chezmoi apply --dry-run (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "${HOME}/.local/bin"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$HOME/.local/bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Invoke-WebRequest -Uri "https://get.chezmoi.io/ps1" -OutFile "$env:TEMP/get-chezmoi.ps1"
          & "$env:TEMP/get-chezmoi.ps1" -b $binDir
          echo "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Dry-run — verify all templates render without errors (Unix)
        if: runner.os != 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          chezmoi apply --dry-run --force --source="${GITHUB_WORKSPACE}" 2>&1

      - name: Dry-run — verify all templates render without errors (Windows)
        if: runner.os == 'Windows'
        env:
          NREDF_NO_BOOTSTRAP: "1"
        shell: pwsh
        run: |
          chezmoi apply --dry-run --force --source="${env:GITHUB_WORKSPACE}"

  # ── aqua config validation ───────────────────────────────────────────────────
  aqua-validate:
    name: aqua install (validate pinned versions)
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.0.5
        with:
          aqua_version: v2.62.3

      - name: Install every pinned package (all tags) — fails if a version/asset doesn't exist
        working-directory: home/dot_config/aquaproj-aqua
        env:
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_POLICY_CONFIG: ${{ github.workspace }}/home/dot_config/aquaproj-aqua/aqua-policy.yaml
        run: aqua install -a
